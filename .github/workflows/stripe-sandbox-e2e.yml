name: Stripe Sandbox E2E (manual, test mode only)

# Manual only: never runs on push or pull_request, so normal CI cannot execute it.
# The test key lives in the GitHub Environment "stripe-sandbox" (secret STRIPE_TEST_SECRET_KEY).
# Configure that environment with required reviewers and restrict deployments to protected branches.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SANDBOX to confirm this run uses a Stripe TEST key only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stripe-sandbox-e2e
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit sandbox confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "SANDBOX" ]; then
            echo "::error::Type SANDBOX to confirm this run uses a Stripe test key."
            exit 1
          fi

  stripe-sandbox-e2e:
    needs: validate-confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stripe-sandbox
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: multigo
          POSTGRES_PASSWORD: multigo_test
          POSTGRES_DB: multigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multigo -d multigo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://multigo:multigo_test@localhost:5432/multigo_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply base schema
        run: PGPASSWORD=multigo_test psql -h localhost -U multigo -d multigo_test -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Apply migrations in order
        run: bash database/migrate.sh
      - name: Verify the key is a Stripe TEST key (value is never printed)
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          normalized_key="$(printf '%s' "$STRIPE_TEST_SECRET_KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$normalized_key" ]; then
            echo "::error::Secret STRIPE_TEST_SECRET_KEY is not configured in the stripe-sandbox environment."
            exit 1
          fi
          case "$normalized_key" in
            sk_test_*|rk_test_*) echo "Key format check passed (test mode)." ;;
            *) echo "::error::Expected a Stripe test secret (sk_test_) or restricted test key (rk_test_). Refusing to run."; exit 1 ;;
          esac
      - name: Run Stripe sandbox E2E (test mode)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_SANDBOX_E2E: '1'
        run: npm run test:int --workspace backend -- stripe-sandbox-e2e --reporter=verbose
