name: JEANLOUISGO CI — PostgreSQL

permissions:
  contents: read

concurrency:
  group: jeanlouisgo-postgres-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'recovery/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      defer_migration_019:
        description: 'Leave migration 019 unapplied pending the historical ledger audit'
        required: false
        default: false
        type: boolean

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: multigo
          POSTGRES_PASSWORD: multigo_test
          POSTGRES_DB: multigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multigo -d multigo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://multigo:multigo_test@localhost:5432/multigo_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply base schema
        run: PGPASSWORD=multigo_test psql -h localhost -U multigo -d multigo_test -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Apply migrations in order
        env:
          DEFER_MIGRATION_019: ${{ inputs.defer_migration_019 || 'false' }}
        run: |
          if [ "$DEFER_MIGRATION_019" = "true" ]; then
            for migration in database/migrations/*.sql; do
              name=$(basename "$migration")
              if [ "$name" = "019_clearing_credit_unique.sql" ]; then
                echo "Deferring $name until the authorized historical ledger audit is complete."
                continue
              fi
              psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
            done
          else
            bash database/migrate.sh
          fi
      - name: Static QA
        run: bash tests/final/static-qa.sh
      - name: Backend build
        run: npm run build --workspace backend
      - name: Backend tests
        run: npm test --workspace backend
      - name: Frontend packages lint and tests
        run: |
          npm run lint --workspace @multigo/api-client
          npm test --workspace @multigo/api-client
          npm run lint --workspace @multigo/app-shell
          npm test --workspace @multigo/app-shell
      - name: Customer app lint, tests and build
        run: |
          npm run lint --workspace @multigo/customer-app
          npm test --workspace @multigo/customer-app
          npm run build --workspace @multigo/customer-app
      - name: Merchant app lint, tests and build
        run: |
          npm run lint --workspace @multigo/merchant-app
          npm test --workspace @multigo/merchant-app
          npm run build --workspace @multigo/merchant-app
      - name: Admin app lint, tests and build
        run: |
          npm run lint --workspace @multigo/admin-app
          npm test --workspace @multigo/admin-app
          npm run build --workspace @multigo/admin-app
      - name: Driver app lint, tests and build
        run: |
          npm run lint --workspace @multigo/driver-app
          npm test --workspace @multigo/driver-app
          npm run build --workspace @multigo/driver-app
      - name: Backend PostgreSQL integration tests
        env:
          DATABASE_URL: postgres://multigo:multigo_test@localhost:5432/multigo_test
        run: npm run test:int --workspace backend -- --no-file-parallelism --maxWorkers=1
